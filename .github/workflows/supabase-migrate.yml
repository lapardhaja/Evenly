# Apply supabase/migrations to the production Supabase project on main.
# Vercel only hosts the SPA + /api/scan — it does not run these.
#
# Repo secrets:
#   SUPABASE_ACCESS_TOKEN  — Account → Access Tokens (CI)
#   SUPABASE_PROJECT_ID    — Project Settings → General → Reference ID
#   SUPABASE_DB_PASSWORD   — database password (Settings → Database)
#
# First run against a project that was migrated by hand: see docs/SUPABASE_DATABASE.md
# ("Baselining") so history matches files already applied.

name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link and push migrations
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, or SUPABASE_DB_PASSWORD"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --yes
