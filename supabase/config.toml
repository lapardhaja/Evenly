# Local CLI label (not the cloud project ref). `supabase link --project-ref`
# in GitHub Actions still uses SUPABASE_PROJECT_ID. An empty string is rejected
# by the CLI / Git branching preview ("Missing required field in config: project_id").

project_id = "evenly"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15
